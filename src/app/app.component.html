<a class="skip-link" href="#main-content">Skip to main content</a>
<app-navbar></app-navbar>
<main id="main-content">
  <router-outlet></router-outlet>
</main>
<app-footer></app-footer>

<div class="whatsapp-float-wrapper" aria-live="polite">
  <div class="whatsapp-notice" *ngIf="isNotificationVisible" role="status" aria-label="Admission help notification">
    <span>Need help with Admission?</span>
    <button type="button" class="whatsapp-notice-close" (click)="dismissNotification()" aria-label="Dismiss notification">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <a
    class="whatsapp-float"
    href="{{ whatsAppUrl }}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Chat with WhatsApp Admission Office"
    title="Chat with Admission Office"
    (click)="handleWhatsAppClick($event)"
  >
    <i class="fa-brands fa-whatsapp"></i>
  </a>
</div>
