<div class="top-bar">
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2 py-2">
    <div class="d-flex flex-wrap align-items-center gap-3">
      <span><i class="fa-solid fa-phone me-2"></i>+91 9415181626</span>
      <span><i class="fa-solid fa-envelope me-2"></i>info&#64;pragalbhpublicschool.com</span>
    </div>
    <a class="top-bar-link" routerLink="/admissions">Admission Open 2026</a>
  </div>
</div>

<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <img src="assets/images/logo.png" alt="New Pragalbhya Public School logo" class="brand-logo" />
      <span class="brand-text">
        <strong>New Pragalbhya Public School</strong>
        <small>Learning with Excellence</small>
      </span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item" *ngFor="let item of navItems">
          <ng-container *ngIf="item.children; else simpleLink">
            <div class="dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" aria-expanded="false">
                {{ item.label }}
              </a>
              <ul class="dropdown-menu shadow-sm">
                <li *ngFor="let child of item.children">
                  <a class="dropdown-item" [routerLink]="child.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ child.label }}</a>
                </li>
              </ul>
            </div>
          </ng-container>

          <ng-template #simpleLink>
            <a class="nav-link" [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ item.label }}</a>
          </ng-template>
        </li>
      </ul>

      <button type="button" class="theme-toggle ms-lg-3" (click)="toggleTheme()" [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
        <i class="fa-solid" [ngClass]="isDarkMode ? 'fa-sun' : 'fa-moon'"></i>
      </button>
      <a class="btn btn-admission ms-2 ms-lg-3" routerLink="/admissions">Apply Now</a>
    </div>
  </div>
</nav>
